<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 16 16" width="16" height="16" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <!-- Hand-drawn for 16px. Inner corners are square on purpose: at this size
       a 1px radius renders as a blob, not a screen. -->
  <rect width="16" height="16" rx="3" fill="#2F6BE0"/>
  <rect x="9" y="2" width="5" height="4" fill="#fff"/>
  <rect x="2.5" y="8.5" width="7" height="5" fill="none" stroke="#fff" stroke-width="1"/>
</svg>
